services:
  frontend:
    build:
      context: .
      args:
        VITE_ENABLE_MP_TEST_CHECKOUT: "true"
    container_name: valux-frontend
    restart: unless-stopped
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    name: valux_deco_edge
    external: true
