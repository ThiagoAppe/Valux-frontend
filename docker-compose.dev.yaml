# Frontend development server. This Compose project is separate from the
# production Nginx container and serves the source tree with Vite HMR.
name: valux-frontend-dev

services:
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - frontend_dev_node_modules:/app/node_modules
    init: true

volumes:
  frontend_dev_node_modules:
